project:
  type: website
  output-dir: ../docs

website:
  title: "{{ cookiecutter.project_name }}"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - about.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    embed-resources: true
    include-after-body:
      # Reader-comment widget: master panel on every page, plus optional
      # ::: {.comment-box} markers placed by hand. See _comment_widget.html.
      - _comment_widget.html
      # Floating "Contents" dropdown instead of a right-margin TOC. See _toc_dropdown.html.
      - _toc_dropdown.html